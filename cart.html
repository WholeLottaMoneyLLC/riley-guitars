<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart — Riley Guitars</title>
<meta name="description" content="Your Riley Guitars cart.">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="assets/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/vendor/lenis-1.3.26/lenis.css">
<script>if(!window.matchMedia||!matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("fx-pending");setTimeout(function(){document.documentElement.classList.remove("fx-pending")},3000)}</script>
</head>
<body data-page="cart">
<div id="site-header"></div>

<main id="main">
  <div class="container" style="padding-top:24px">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="store.html">Store</a><span aria-hidden="true">/</span><span>Cart</span></nav>
    <h1 style="margin-top:14px;font-size:clamp(2.2rem,6vw,3.5rem)">Your cart</h1>
  </div>
  <div class="container" id="cart-root"></div>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/vendor/gsap-3.15.0/gsap.min.js"></script>
<script src="assets/vendor/gsap-3.15.0/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis-1.3.26/lenis.min.js"></script>
<script src="assets/js/effects.js"></script>
<script>
  (function () {
    var UI = window.RileyUI, R = window.RILEY, esc = UI.esc, root = document.getElementById('cart-root');

    function lines() {   // same storage as the drawer: riley-cart = [{id, qty}]
      var c = []; try { c = JSON.parse(localStorage.getItem('riley-cart') || '[]'); } catch (e) {}
      return (Array.isArray(c) ? c : []).filter(function (i) { return i && UI.getProduct(i.id); });
    }
    function render() {
      var c = lines();
      if (!c.length) {
        root.innerHTML = '<div class="cart-page-empty"><p class="serif" style="font-size:clamp(1.6rem,4vw,2.2rem)">Your cart is empty.</p><p class="muted mt-1">Every guitar in the store is one of one.</p><a class="btn btn-primary" href="store.html">Shop current stock</a> <a class="btn btn-outline" href="custom-build.html">Start a custom build</a></div>';
        return;
      }
      var sub = 0;
      var html = c.map(function (i) {
        var p = UI.getProduct(i.id); sub += p.price * i.qty;
        var href = 'product.html?p=' + encodeURIComponent(p.slug);
        return '<div class="cart-line"><a href="' + href + '"><img src="' + esc(p.images[0]) + '" alt="' + esc(p.title) + '" width="120" height="150"></a>' +
          '<div><h2><a href="' + href + '">' + esc(p.title) + '</a></h2><p class="meta">' + esc(p.type) + ' &middot; One of one &middot; Qty ' + i.qty + '</p>' +
          '<button class="cart-remove" type="button" data-remove-line="' + esc(p.id) + '">Remove</button></div>' +
          '<span class="item-price">' + UI.money(p.price * i.qty) + '</span></div>';
      }).join('');
      root.innerHTML = '<div class="cart-page"><div><div class="cart-lines">' + html + '</div><p class="mt-3"><a class="link-arrow" href="store.html">Continue shopping</a></p></div>' +
        '<aside class="cart-summary" aria-label="Order summary"><h2>Order summary</h2>' +
        '<div class="cart-total"><span>Subtotal</span><strong>' + UI.money(sub) + '</strong></div>' +
        '<p class="form-note">Shipping and taxes calculated at checkout. Every guitar ships in a Mono case or sleeve.</p>' +
        '<p class="cart-demo" id="page-demo" role="status" hidden>Demo site &mdash; checkout isn&rsquo;t connected.</p>' +
        '<button class="btn btn-primary btn-block" type="button" id="page-checkout">Checkout</button></aside></div>';
    }
    root.addEventListener('click', function (e) {
      var rm = e.target.closest('[data-remove-line]');
      if (rm) { UI.removeFromCart(rm.getAttribute('data-remove-line')); render(); return; }
      if (e.target.closest('#page-checkout')) { document.getElementById('page-demo').hidden = false; UI.toast('Demo site — checkout isn’t connected.'); }
    });
    window.addEventListener('storage', render);
    render();
  })();
</script>
</body>
</html>
